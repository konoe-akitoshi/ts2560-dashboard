apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ts2560-dashboard
  labels:
    app.kubernetes.io/name: ts2560-dashboard
    # Prometheus の serviceMonitorSelector に合わせる（kube-prometheus-stack の既定は release: <リリース名>）
    # release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ts2560-dashboard
  endpoints:
    - port: http
      path: /metrics
      # ダッシュボードは機器を10秒ごとに読む。それより短くしても値は変わらない
      interval: 30s
