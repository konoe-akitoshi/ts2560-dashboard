apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ts2560
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# 機器のアドレスとログイン情報。credentials.env.example をコピーして credentials.env を作る（git には入らない）
secretGenerator:
  - name: ts2560-credentials
    envs:
      - credentials.env
images:
  - name: ghcr.io/konoe-akitoshi/ts2560-dashboard
    newTag: latest
